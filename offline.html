<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F172A">
<title>لا يوجد اتصال — خطة موجهي الضبعة</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#0F172A;
    color:#FFFFFF;
    font-family:'Tajawal','Cairo',system-ui,sans-serif;
    text-align:center;
    padding:24px;
  }
  .box{max-width:420px}
  .logo-mark{
    width:88px;height:88px;border-radius:22px;
    background:#3B82F6;
    display:flex;align-items:center;justify-content:center;
    font-size:42px;font-weight:800;color:#fff;
    margin:0 auto 24px;
    box-shadow:0 16px 48px rgba(0,0,0,.45);
  }
  h1{font-size:22px;margin-bottom:12px;color:#fff}
  p{color:#CBD5E1;line-height:1.8;margin-bottom:24px}
  button{
    background:#3B82F6;color:#fff;border:none;
    padding:12px 28px;border-radius:10px;
    font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;
  }
  button:hover{background:#2f6ad1}
  .hint{margin-top:20px;font-size:13px;color:#8CA0BE}
</style>
</head>
<body>
  <div class="box">
    <div class="logo-mark">ض</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>
      يبدو أنك غير متصل بالإنترنت حالياً. الصفحات التي فتحتها من قبل ما زالت
      متاحة وتعمل من الذاكرة المؤقتة، وبياناتك محفوظة بالكامل على جهازك.
    </p>
    <button onclick="location.href='./index.html'">العودة إلى التطبيق</button>
    <div class="hint">سيُعاد تحميل آخر نسخة محفوظة من التطبيق تلقائياً عند توفر الاتصال.</div>
  </div>
</body>
</html>
