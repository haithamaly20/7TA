<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خطة موجهي الضبعة</title>

  <!-- الأننماط البرمجية والتنسيقات -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

  <!-- شريط الملاحة والأزرار الرئيسية -->
  <header class="main-header">
    <div class="container flex-between">
      <h1>تطبيق خطة موجهي الضبعة</h1>
      <div class="actions flex-gap">
        <button class="btn btn-primary" onclick="APP.printing.printGeneralPlan(APP.storage.getPlans())">طباعة الخطة العامة</button>
        <button class="btn btn-success" onclick="APP.sheetsSync.saveBackupToDrive('Dabaa_Plan_Backup.json', JSON.stringify(APP.storage.getFullExportData()))">حفظ نسخة في Drive</button>
      </div>
    </div>
  </header>

  <main class="container content">

    <!-- قسم الفلترة وشريط البحث للمعاهد -->
    <section class="card">
      <h3>إدارة المعاهد الأزهرية</h3>
      
      <div class="table-toolbar flex-between margin-bottom">
        <div class="search-box">
          <input type="text" id="instituteSearchInput" class="form-control" placeholder="بحث باسم أو كود المعهد..." oninput="APP.institutes.filterTable()">
        </div>
        
        <div class="filters flex-gap">
          <select id="filterDepartment" class="form-control" onchange="APP.institutes.filterTable()">
            <option value=""> جميع الإدارات </option>
          </select>

          <select id="filterStage" class="form-control" onchange="APP.institutes.filterTable()">
            <option value=""> جميع المراحل </option>
          </select>

          <button class="btn btn-outline" onclick="APP.institutes.resetFilters()">إعادة ضبط</button>
        </div>

        <div id="institutesCountBadge" class="badge blue">العدد: 0</div>
      </div>

      <!-- جدول عرض المعاهد -->
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>اسم المعهد</th>
              <th>الكود</th>
              <th>الإدارة</th>
              <th>المرحلة</th>
            </tr>
          </thead>
          <tbody id="institutesTableBody">
            <!-- يتم تعبئة البيانات ديناميكياً بواسطة institutes.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- منطقة الطباعة المخصصة المستقلة -->
  <div id="printArea"></div>

  <!-- تحميل الملفات والخدمات البرمجية بالترتيب الصحيح -->
  <script src="js/config.js"></script>
  <script src="js/services/storage.js"></script>
  <script src="js/services/sheetsSync.js"></script>
  <script src="js/services/printing.js"></script>
  <script src="js/modules/institutes.js"></script>

  <script>
    // تشغيل التهيئة الابتدائية للتطبيق فور اكتمال التحميل
    document.addEventListener('DOMContentLoaded', () => {
      if (window.APP && window.APP.institutes) {
        window.APP.institutes.init();
      }
    });
  </script>

</body>
</html>
